<title>PC Arcade 2.7.7</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
/* Layout: one portrait screen. Monitor (top third) / thumb pad or vintage keyboard (middle) / slim switch bar (bottom). */
:root{
  --bg:#030302;
  --glass:#060402;
  --phos-rgb:232,176,44;
  --phos:rgb(var(--phos-rgb));
  --text:rgba(var(--phos-rgb),.82);
  --mute:rgba(var(--phos-rgb),.42);
  --line:rgba(var(--phos-rgb),.18);
  --line-strong:rgba(var(--phos-rgb),.5);
  --fill:rgba(var(--phos-rgb),.035);
  --press:rgba(var(--phos-rgb),.16);
  --font-term:"VT323",Menlo,"Courier New",monospace;
  --font-ui:"IBM Plex Mono",Menlo,"Courier New",monospace;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);overflow:hidden;overscroll-behavior:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:none}
[hidden]{display:none!important}
button:focus-visible{outline:1px dashed var(--phos);outline-offset:2px}

#app{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px 4px}

/* Monitor */
.monitor{flex:0 0 auto;display:flex;justify-content:center}
.frame{width:100%;border:1px solid var(--line);border-radius:16px;padding:4px 4px 4px;display:flex;flex-direction:column;gap:5px;
  box-shadow:0 0 0 1px rgba(0,0,0,.6) inset}
.frame-top{display:flex;align-items:center;justify-content:space-between;font:500 9px/1 var(--font-ui);letter-spacing:.18em;color:var(--mute);text-transform:uppercase;padding-inline:4px}
.led{width:6px;height:6px;border-radius:50%;background:var(--phos);box-shadow:0 0 6px var(--phos)}
.crt{position:relative;padding:2px 3px;border-radius:12px/16px;overflow:hidden;background:var(--glass);
  box-shadow:inset 0 0 28px rgba(var(--phos-rgb),.07),inset 0 0 2px rgba(var(--phos-rgb),.25)}
#scr{display:block;width:100%;height:100%;
  filter:drop-shadow(0 0 1.2px rgba(var(--phos-rgb),.85)) drop-shadow(0 0 5px rgba(var(--phos-rgb),.3))}
.scan{position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(120% 95% at 50% 50%,transparent 60%,rgba(0,0,0,.55) 100%),
    repeating-linear-gradient(to bottom,transparent 0 2px,rgba(0,0,0,.26) 2px 3px)}

/* Controls */
.controls{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;padding-top:10px}
.strip{display:flex;justify-content:space-between;align-items:center;font:500 9px/1 var(--font-ui);letter-spacing:.18em;text-transform:uppercase;color:var(--mute);padding:2px 4px 8px}
.pane{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}

.pad-space{flex:1;min-height:0}
/* left 2/3: LEFT + RIGHT squares; right 1/3: HOP over BACK. Squares cap near 1" (about 154px on iPhone). */
.pad{flex:0 0 auto;display:grid;grid-template-columns:repeat(3,minmax(0,154px));justify-content:space-between;gap:12px;padding-bottom:10px}
.pad .pb{aspect-ratio:1;width:100%;height:auto;border:1.5px solid var(--line-strong);border-radius:18px;background:var(--fill)}
.pad .pb.off{border-color:var(--line);background:transparent;opacity:.35}
.lay-four .a-l{grid-area:l;align-self:center}.lay-four .a-r{grid-area:r;align-self:center}
.lay-four .a-u{grid-area:u}.lay-four .a-d{grid-area:d}
.lay-four .a-f{grid-area:f;aspect-ratio:auto;height:100%}
.lay-eight.mir{grid-template-columns:minmax(0,140px) repeat(3,minmax(0,74px));grid-template-areas:"f ul u ur" "f l . r" "f dl d dr"}
html.color #scr{filter:none}
.bar button:focus{outline:none}
.bar .chips{gap:5px}
.bar .chip{letter-spacing:.1em;padding:9px 6px;text-align:center;white-space:nowrap}
.chip.mode{min-width:58px}#sndBtn{min-width:72px}#phosBtn{min-width:56px}.chip.fk{min-width:32px;padding:9px 4px}
.lay-cross{--cx:minmax(0,82px);--cf:minmax(0,118px);gap:8px;justify-content:stretch}
.pb{transition:none}.pb.on{box-shadow:none}
.booting #pad,.booting #kbd,.booting .strip span{visibility:hidden}
.lay-slide{grid-template-columns:1fr}
.pad.lay-row{display:flex;justify-content:center;align-items:center;gap:12px}
.lay-row .pb{width:var(--sq,110px);flex:0 0 auto}
.slider{height:clamp(110px,26vw,154px);border:1.5px solid var(--line-strong);border-radius:18px;background:var(--fill);touch-action:none;
  display:flex;align-items:center;justify-content:center;font:18px/1 var(--font-term);letter-spacing:.3em;color:var(--mute)}
.slider.on{background:var(--press);color:var(--phos)}
.stick{aspect-ratio:1;width:100%;align-self:center;touch-action:none}
.stick svg{width:100%;height:100%;overflow:visible}
.stick .w{fill:var(--fill);stroke:var(--line-strong);stroke-width:1.2;stroke-linejoin:round;transition:fill .06s}
.stick .w.on{fill:var(--press);stroke:var(--phos)}
.stick .lbl{font:5.5px var(--font-term);letter-spacing:.06em;fill:var(--text);text-anchor:middle;pointer-events:none}
.stick .ch{fill:none;stroke:var(--text);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.lay-cross .pb{border-radius:14px}.lay-cross .pb svg{width:30px;height:30px}.lay-cross .pb span{font-size:15px}
.lay-cross .a-u{grid-area:u}.lay-cross .a-d{grid-area:d}.lay-cross .a-l{grid-area:l}.lay-cross .a-r{grid-area:r}
.lay-cross .a-f{grid-area:f;aspect-ratio:auto;height:100%}
.chip.lay{padding:5px 9px;display:flex;align-items:center}
.chip.lay svg{width:34px;height:19px;fill:none;stroke:currentColor;stroke-width:1.2}
.chip.lay:disabled{opacity:.3}
.chip.lay[hidden]{display:none}
.lay-hopper{grid-template-areas:"l r u" "l r d"}
.lay-hopper .a-l{grid-area:l;align-self:center}.lay-hopper .a-r{grid-area:r;align-self:center}
.lay-hopper .a-u{grid-area:u;align-self:end}.lay-hopper .a-d{grid-area:d;align-self:start}
.lay-lr2{grid-template-areas:"l . r"}
.lay-lr2 .a-l{grid-area:l}.lay-lr2 .a-r{grid-area:r}
.lay-eight{grid-template-columns:repeat(3,minmax(0,74px)) minmax(0,140px);grid-template-areas:"ul u ur f" "l . r f" "dl d dr f";gap:8px}
.lay-eight .pb{border-radius:14px}.lay-eight .pb span{font-size:24px}.lay-eight .pb svg{width:30px;height:30px}
.lay-eight .a-ul{grid-area:ul}.lay-eight .a-u{grid-area:u}.lay-eight .a-ur{grid-area:ur}.lay-eight .a-l{grid-area:l}.lay-eight .a-r{grid-area:r}
.lay-eight .a-dl{grid-area:dl}.lay-eight .a-d{grid-area:d}.lay-eight .a-dr{grid-area:dr}.lay-eight .a-f{grid-area:f;aspect-ratio:auto;height:100%}
.lay-lander{grid-template-columns:repeat(3,minmax(0,74px)) repeat(2,minmax(0,60px));grid-template-areas:"ul u ur t6 t5" "l . r t4 t3" ". . . t2 t1";gap:8px}
.lay-lander .pb{border-radius:14px}.lay-lander .pb span{font-size:22px}.lay-lander .pb svg{width:30px;height:30px}
.lay-lander .a-ul{grid-area:ul}.lay-lander .a-u{grid-area:u}.lay-lander .a-ur{grid-area:ur}.lay-lander .a-l{grid-area:l}.lay-lander .a-r{grid-area:r}
.lay-lander .a-t1{grid-area:t1}.lay-lander .a-t2{grid-area:t2}.lay-lander .a-t3{grid-area:t3}.lay-lander .a-t4{grid-area:t4}.lay-lander .a-t5{grid-area:t5}.lay-lander .a-t6{grid-area:t6}
.pb.sel{background:var(--press);color:var(--phos)}
.lay-lrf{grid-template-areas:"l r f"}
.lay-lrf .a-l{grid-area:l}.lay-lrf .a-r{grid-area:r}.lay-lrf .a-f{grid-area:f}
.pb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font:20px/1 var(--font-term);letter-spacing:.14em;color:var(--text);transition:background .06s}
.pb span{font-size:16px}
.pb svg{width:42px;height:42px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linejoin:round}
.pb.on{background:var(--press);color:var(--phos);box-shadow:inset 0 0 26px rgba(var(--phos-rgb),.28)}

.kbd{flex:1;display:flex;flex-direction:column;gap:5px;min-height:0;padding-bottom:6px}
.krow{flex:1;display:flex;gap:4px;min-height:0}
.key{flex:var(--w,1) 1 0;min-width:0;position:relative;border:1px solid var(--line-strong);border-radius:6px;background:var(--fill);
  font:19px/1 var(--font-term);color:var(--text);display:flex;align-items:center;justify-content:center;white-space:nowrap;overflow:hidden}
.key.sm{font-size:14px;letter-spacing:.04em}
.key.mod{background:rgba(var(--phos-rgb),.07);border-color:var(--line)}
.key.on{background:var(--press);color:var(--phos)}
.key.latched{background:rgba(var(--phos-rgb),.3);color:#000;border-color:var(--phos)}
.key .lt{position:absolute;top:4px;right:4px;width:4px;height:4px;border-radius:50%;background:var(--line)}
.key .lt.lit{background:var(--phos);box-shadow:0 0 5px var(--phos)}
.leds{display:flex;gap:12px;align-items:center}
.leds span{display:inline-flex;gap:5px;align-items:center}
.leds i{width:5px;height:5px;border-radius:50%;background:var(--line);display:inline-block}
.leds i.lit{background:var(--phos);box-shadow:0 0 5px var(--phos)}
#readout{font-variant-numeric:tabular-nums;color:var(--text)}

/* Switch bar */
.bar{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:6px;padding-bottom:env(safe-area-inset-bottom,0px);border-top:1px solid var(--line)}
.seg{display:flex;border:1px solid var(--line-strong);border-radius:999px;overflow:hidden}
.seg button,.chip{font:500 10px/1 var(--font-ui);letter-spacing:.16em;text-transform:uppercase;padding:9px 13px;color:var(--mute)}
.seg button[aria-pressed="true"]{background:var(--phos);color:#000}
.chips{display:flex;gap:6px}
.chip{border:1px solid var(--line);border-radius:999px;padding:9px 11px}
@media (prefers-reduced-motion:reduce){.pb{transition:none}}
</style>

<div id="app">
  <section class="monitor" aria-label="Monochrome display">
    <div class="frame" id="frame">

  </nav>
</div>

      for (let d = 6; d >= 1; d--) if (h.has(String(d))) { n = d; break; }
      const up = h.has('Up') || h.has('8'), left = h.has('Left') || h.has('4'), right = h.has('Right') || h.has('6');
      const ul = h.has('7') || h.has('Home') || (up && left), ur = h.has('9') || h.has('PgUp') || (up && right);
      const anyDir = up || left || right || ul || ur;
      if (anyDir && !n) n = S.latch;
      const thrust = anyDir && S.fuel > 0 ? 3.3 * Math.pow(n, 1.3) : 0;
      let ax = 0, ay = G;
      if (thrust) {
        if (ul || ur) { ay -= thrust; ax += ul ? -thrust : thrust; S.fuel -= thrust * 1.25 * dt; }
        else if (up) { ay -= thrust; S.fuel -= thrust * dt; }
        else { ax += left ? -thrust : thrust; S.fuel -= thrust * dt; }
      }
      S.burn = thrust > 0;
      S.vv += ay * dt; S.hv += ax * dt;
      S.y += S.vv * dt; S.wx += S.hv / UX * dt;
      hud();
      if (S.y < -UY * 6) { message('Sorry,  But You Blasted Out Of Orbit', 'Your Ship Is Forever Lost In Space'); scoreLine(); S.phase = 'over'; gameOver(); return; }
      // the original switches to the close-up once the lander is down to screen row 11
      const feet = [ground(S.wx - 0.3), ground(S.wx), ground(S.wx + 0.3)];
      const clear = Math.min(...feet.map(g => g[0])) - (S.y + UY);
      S.view = S.y >= 10 * UY ? 'close' : 'far';
      if (S.view === 'far') far(); else close();
      if (clear <= 0) {
        const flat = feet.every(g => g[1]) && Math.abs(feet[0][0] - feet[2][0]) < 1;
        if (flat && Math.abs(S.vv) <= 15 && Math.abs(S.hv) <= 15) {
          // narrow pads are worth more
          let w = 0; for (let k = -6; k <= 6; k++) if (ground(S.wx + k)[1]) w++;
          S.score += Math.max(50, (8 - Math.min(7, w)) * 50) + Math.round(S.fuel / 10);
          S.vv = 0; S.hv = 0; S.burn = false; close(); hud();
          message('The PC  EAGLE Has Landed !!!', 'Great Landing. You Get Another Try'); scoreLine();
          S.phase = 'landed'; S.timer = 4;
        } else crash();
      }
    }
  };
})();

/* ===== C: BUG BLASTER =====
   Measured: a graphics-mode game, all white. Field between two mushroom borders (columns 16 and 64);
   mushrooms take four hits (each shot clips one more row off the original shape); a 14-segment O centipede
   enters at the top and runs about 18 columns a second, dropping a row at walls and mushrooms; your ▲ blaster
   moves about 16 columns a second near the bottom. Points: mushroom 1, body 10, head 100, spider 300-900.
   Sound: a 98 Hz thump about every 0.45 s while the centipede marches; death is a recorded clip. */
GAMES.c = (() => {
  const hex = h => Array.from({ length: 8 }, (_, i) => parseInt(h.substr(i * 2, 2), 16));
  const M4 = 1, M3 = 3, M2 = 4, M1 = 5, SPIDER = 6, BURST = 7;   // borrowed codes for the custom shapes
  const FONT_BB = { [M4]: hex('387cfefe38383800'), [M3]: hex('387cfefe38000000'), [M2]: hex('387cfefe00000000'), [M1]: hex('387c000000000000'),
    [SPIDER]: hex('c6386cc6c66c3800'), [BURST]: hex('66a5c31818c3a566') };
  const MUSH = [0, M1, M2, M3, M4];
  const XL = 17, XR = 63, PLAYER_TOP = 18, SEG = 79, SHOT = 24, SHIP = 30;
  // 2.7.5: the blaster moves 12 columns a second (the original's 16 overshoots under a thumb)
  const SEG_STEP = 0.055, SHIP_STEP = 1 / 12, SHOT_STEP = 1 / 45;
  const hiKey = 'hi.c';
  let S;
  function addScore(v) {
    const p = S.p[S.cur]; p.score += v; if (p.score > S.hi) { S.hi = p.score; store.set(hiKey, S.hi); }
    put(0, 2, ' '.repeat(16), 15, 0); const s = String(p.score); put(11 - s.length, 2, s, 15, 0);
  }
  function lives() { put(0, 4, ' '.repeat(16), 15, 0); for (let i = 0; i < S.p[S.cur].lives - 1; i++) putc(4 + i, 4, SHIP, 15); }
  const mAt = (r, x) => S.mush[r * 80 + x];
  function drawM(r, x) { const h = mAt(r, x); putc(x, r, h ? MUSH[h] : 32, 15); }
  function field() {
    cls();
    put(4, 0, 'SCORE', 15, 0);
    for (let r = 0; r <= 23; r++) { putc(16, r, M4, 15); putc(64, r, M4, 15); }
    for (let i = 0; i < 80 * 25; i++) if (S.mush[i]) drawM(Math.floor(i / 80), i % 80);
    put(19, 24, BAR.trim(), 15, 0);
    addScore(0); lives();
  }
  function newCentipede(n = 14) {
    S.segs = [];
    for (let i = 0; i < n; i++) S.segs.push({ r: 0, x: 43 - i, dx: 1, head: i === 0, down: 1 });
  }
  function freshMushrooms() {
    S.mush = new Uint8Array(2000);
    for (let i = 0; i < 38; i++) { const r = 1 + Math.floor(Math.random() * 21), x = XL + Math.floor(Math.random() * (XR - XL + 1)); S.mush[r * 80 + x] = 4; }
  }
  function startLife() {
    S.ship = { r: 23, x: 40 }; S.shot = null; S.spider = null; S.spiderT = 4 + Math.random() * 4;
    newCentipede(); S.phase = 'play'; S.segT = 0; S.thumpT = 0; S.shipT = 0;
    field(); putc(S.ship.x, S.ship.r, SHIP, 15);
  }
  function moveSegs() {
    for (const s of S.segs) putc(s.x, s.r, mAt(s.r, s.x) ? MUSH[mAt(s.r, s.x)] : 32, 15);
    // each segment follows the logic of a head: step sideways, or drop a row and turn at walls and mushrooms
    for (const s of S.segs) {
      const nx = s.x + s.dx;
      if (nx < XL || nx > XR || mAt(s.r, nx)) {
        s.dx = -s.dx;
        let nr = s.r + s.down;
        if (nr > 23) { s.down = -1; nr = s.r - 1; }
        if (nr < PLAYER_TOP && s.down < 0) { s.down = 1; nr = s.r + 1; }
        s.r = nr;
      } else s.x = nx;
    }
    for (const s of S.segs) putc(s.x, s.r, SEG, 15);
  }
  function killShip() { S.phase = 'dead'; S.timer = 2.0; clip('bug_die'); putc(S.ship.x, S.ship.r, BURST, 15); }
  return {
    view: [0, 80], pad: 'eight', font: FONT_BB,
    start(n) {
      S = { n, cur: 0, p: Array.from({ length: n }, () => ({ score: 0, lives: 5 })), hi: store.get(hiKey, 0), held: new Set() };
      freshMushrooms(); startLife();
    },
    stop() { spkStop(); },
    key(k, down) {
      if (down) S.held.add(k); else S.held.delete(k);
      // one shot on screen at a time, as in the original; holding FIRE refires the moment it is gone (2.7.3),
      // and a tap while a shot is still flying is kept for 0.25 s instead of being dropped
      if (k === 'Space' || k === 'Fire') { S.firing = down; if (down) S.fireBuf = 0.25; }
    },
    update(dt) {
      if (S.phase === 'dead') {
        S.timer -= dt;
        if (S.timer <= 0) {
          S.p[S.cur].lives--;
          if (S.p.every(q => q.lives <= 0)) { S.phase = 'over'; gameOver(); return; }
          if (S.n > 1) { const o = (S.cur + 1) % S.n; if (S.p[o].lives > 0) S.cur = o; }
          startLife();
        }
        return;
      }
      if (S.phase !== 'play') return;
      const h = S.held;
      // blaster: 8 directions; + gives a burst of speed
      const up = h.has('Up') || h.has('8') || h.has('7') || h.has('9'), dn = h.has('Down') || h.has('2') || h.has('1') || h.has('3');
      const lf = h.has('Left') || h.has('4') || h.has('7') || h.has('1'), rt = h.has('Right') || h.has('6') || h.has('9') || h.has('3');
      S.shipT += dt * (h.has('+') || h.has('=') ? 2 : 1);
      while (S.shipT >= SHIP_STEP) {
        S.shipT -= SHIP_STEP;
        const nr = Math.max(PLAYER_TOP, Math.min(23, S.ship.r + (dn ? 1 : 0) - (up ? 1 : 0)));
        const nx = Math.max(XL, Math.min(XR, S.ship.x + (rt ? 1 : 0) - (lf ? 1 : 0)));
        if ((nr !== S.ship.r || nx !== S.ship.x) && !mAt(nr, nx)) { putc(S.ship.x, S.ship.r, 32, 15); S.ship.r = nr; S.ship.x = nx; putc(nx, nr, SHIP, 15); }
      }
      // shot
      S.fireBuf = Math.max(0, (S.fireBuf || 0) - dt);
      if (!S.shot && (S.firing || S.fireBuf > 0)) { S.shot = { r: S.ship.r - 1, x: S.ship.x, t: SHOT_STEP }; S.fireBuf = 0; }
      if (S.shot) {
        S.shot.t += dt;
        while (S.shot && S.shot.t >= SHOT_STEP) {
          S.shot.t -= SHOT_STEP;
          const s = S.shot;
          if (getc(s.x, s.r) === SHOT) putc(s.x, s.r, 32, 15);
          s.r--;
          if (s.r < 0) { S.shot = null; break; }
          const seg = S.segs.findIndex(o => o.r === s.r && o.x === s.x);
          if (seg >= 0) {
            const o = S.segs[seg]; addScore(o.head ? 100 : 10);
            S.mush[o.r * 80 + o.x] = 4; drawM(o.r, o.x);
            if (S.segs[seg + 1]) S.segs[seg + 1].head = true;
            S.segs.splice(seg, 1); S.shot = null; break;
          }
          if (S.spider && Math.abs(S.spider.r - s.r) <= 0 && Math.abs(S.spider.x - s.x) <= 0) {
            const d = Math.abs(S.spider.r - S.ship.r); addScore(d <= 1 ? 900 : d <= 3 ? 600 : 300);
            putc(S.spider.x, S.spider.r, BURST, 15); S.spider = null; S.burstAt = [s.r, s.x, 0.3]; S.shot = null; break;
          }
          if (mAt(s.r, s.x)) {
            S.mush[s.r * 80 + s.x]--; if (!S.mush[s.r * 80 + s.x]) addScore(1);
            drawM(s.r, s.x); S.shot = null; break;
          }
          putc(s.x, s.r, SHOT, 15);
        }
      }
      if (S.burstAt) { S.burstAt[2] -= dt; if (S.burstAt[2] <= 0) { drawM(S.burstAt[0], S.burstAt[1]); S.burstAt = null; } }
      // centipede
      S.segT += dt;
      while (S.segT >= SEG_STEP) { S.segT -= SEG_STEP; moveSegs(); }
      S.thumpT -= dt; if (S.thumpT <= 0 && S.segs.length) { tone(98, 0.075); S.thumpT = 0.45; }
      if (!S.segs.length) { newCentipede(); }
      // spider zigzags across the lower field eating mushrooms
      S.spiderT -= dt;
      if (!S.spider && S.spiderT <= 0) S.spider = { r: 20, x: Math.random() < 0.5 ? XL : XR, dx: 0, dr: -1, t: 0 };
      if (S.spider) {
        const sp = S.spider; sp.t += dt;
        if (!sp.dx) sp.dx = sp.x === XL ? 1 : -1;
        if (sp.t >= 0.09) {
          sp.t = 0; putc(sp.x, sp.r, mAt(sp.r, sp.x) ? MUSH[mAt(sp.r, sp.x)] : 32, 15);
          sp.x += sp.dx; sp.r += sp.dr;
          if (sp.r <= PLAYER_TOP - 2 || sp.r >= 23) sp.dr = -sp.dr;
          if (Math.random() < 0.1) sp.dr = -sp.dr;
          if (mAt(sp.r, sp.x) && Math.random() < 0.3) { S.mush[sp.r * 80 + sp.x] = 0; }
          if (sp.x < XL || sp.x > XR) { S.spider = null; S.spiderT = 4 + Math.random() * 5; }
          else putc(sp.x, sp.r, SPIDER, 15);
        }
      }
      // collisions with the blaster
      if (S.segs.some(o => o.r === S.ship.r && o.x === S.ship.x) || (S.spider && S.spider.r === S.ship.r && S.spider.x === S.ship.x)) killShip();
    }
  };
})();

/* ===== D: GORILLA GORILLA =====
   Measured: a graphics-mode game; three stage screens copied from the original (game 1 coconuts, game 2 rivets,
   game 3 elevators). After the player count it asks TYPE NUMBER OF GAME WANTED <1,2,3>, plays its tune, draws the
   stage and starts after a short jingle. You step 2 columns every 0.2 s, climb a row every 0.41 s and a jump lasts
   0.5 s, one row up. Coconuts roll a column every 0.082 s and fall a row every 0.15 s; the gorilla throws one
   every 2.5 s and the first of each life drops straight into the drum and lights a fire. Fires step every 0.22 s.
   Jumping a coconut is 100 (two at once 300). The coco-masher swings every 0.1 s with a 131 Hz pulse; a smash
   freezes play 1.5 s and pays 300, 500 or 800. Bonus items pay 500. The bonus starts at 5000 and drops 100 every
   2 s. Elevators step every 0.33 s; the stage-3 gorilla bounces a spring every 1.34 s. Death: the original's tune,
   a halo 2.9 s later, and the stage redraws at 4.5 s. Reaching the mate plays the original rescue scene.
   Estimated (not observed): how often coconuts take a ladder, fire wandering, rivet points (100) and the
   gorilla's fall when the last rivet comes out. */
GAMES.d = (() => {
  const G = ASSETS.gg;
  // eased from the original a little: jumps hang 0.56 s (original 0.5; 2.3-2.7.5 used 0.65) and the gorilla throws
  // every 3.5 s (original 2.5)
  const STEP = 0.2, CLIMB = 0.41, JUMP = 0.56, PFALL = 0.2, ROLL = 0.082, CFALL = 0.15, THROW = 3.5;
  const FSTEP = 0.22, FCLIMB = 0.45, MASH = 11.5, ELEV = 0.33, SPRING = 1.34;
  const HX = {
    man: '7effdbffc3e7ff7e', life: '7effdbffc3e70000', coco: '000078cccccc7800', fireA: '102078cccccc7800', fireB: '201078cccccc7800',
    mashUp: '183c7e1818181800', headL: '020e3eff3e0e0200', headR: '80e0f8fef8e08000', shaft: '000000ff00000000',
    halo: '003c664242663c00', heart: '6cfefefe7c381000', flameA: '183060c060301800', flameB: '6030180c18306000',
    spring: 'aa55aa55aa55aa55', girder: '00000000000000ff', blank: '0000000000000000', pole: '0808080808080808',
    rivet: '0000000000ffffff', mate: '7e81a581bd9981ff'
  };
  const ITEMS = ['10387cfe381010ff', '387c38fefe3810ff', '10387cfe7c3810ff'];
  /* ---- glyphs: standard characters keep their codes; the game's own shapes borrow free codes ---- */
  const FONT_GG = {}, STD = new Map(), CODE = new Map();
  for (let c = 255; c >= 1; c--) STD.set(Array.from(FONT.subarray(c * 8, c * 8 + 8), b => b.toString(16).padStart(2, '0')).join(''), c);
  for (let c = 126; c >= 32; c--) STD.set(Array.from(FONT.subarray(c * 8, c * 8 + 8), b => b.toString(16).padStart(2, '0')).join(''), c);
  STD.set(HX.blank, 32);
  const PAGES = G.pages.map(p => { const b = b64bytes(p); return new Uint16Array(b.buffer, b.byteOffset, 2000); });
  const used = new Set(); for (const p of PAGES) for (const v of p) if (v < 256) used.add(v);
  const POOL = [];
  for (let c = 1; c < 256; c++) if (!used.has(c) && !(c >= 32 && c <= 126) && !(c >= 176 && c <= 223)) POOL.push(c);
  function code(hex) {
    if (CODE.has(hex)) return CODE.get(hex);
    let c = STD.get(hex);
    if (c === undefined || c === 1 || c === 2) {
      c = POOL.shift(); if (c === undefined) return 63;
      FONT_GG[c] = Array.from({ length: 8 }, (_, i) => parseInt(hex.substr(i * 2, 2), 16));
    }
    CODE.set(hex, c); return c;
  }
  const hexOf = v => v < 256 ? Array.from(FONT.subarray(v * 8, v * 8 + 8), b => b.toString(16).padStart(2, '0')).join('') : G.glyphs[v - 256];
  const orBottom = (h, b) => h.slice(0, 14) + b.slice(14) === h ? h : h.slice(0, 14) + (parseInt(h.slice(14), 16) | parseInt(b.slice(14), 16)).toString(16).padStart(2, '0');

  let S;
  const base = new Array(2000);             // what the stage shows under the moving things (hex)
  const B = (r, c) => base[r * 80 + c] || HX.blank;
  const setBase = (r, c, h) => { base[r * 80 + c] = h; putc(c, r, code(h), 15); };
  const show = (r, c) => { if (r >= 0 && r < 24 && c >= 0 && c < 80) putc(c, r, code(B(r, c)), 15); };
  // a moving shape keeps the girder line under it
  function spr(r, c, h) { if (r < 0 || r > 23 || c < 0 || c > 79) return; const b = B(r, c); putc(c, r, code(b.endsWith('ff') ? orBottom(h, b) : h), 15); }
  const girder = (r, c) => r >= 0 && r < 24 && c >= 0 && c < 80 && B(r, c).endsWith('ff');
  const byte = (h, i) => parseInt(h.substr(i * 2, 2), 16);
  const railL = h => (byte(h, 1) === 8 && byte(h, 2) === 8) || (byte(h, 5) === 8 && byte(h, 6) === 8);
  const railR = h => (byte(h, 1) === 16 && byte(h, 2) === 16) || (byte(h, 5) === 16 && byte(h, 6) === 16);
  const seg = (r, c) => r >= 0 && r < 24 && railL(B(r, c - 1)) && railR(B(r, c + 1));
  const canUp = (r, c) => seg(r - 1, c) || (seg(r, c) && girder(r - 1, c));
  const canDown = (r, c) => seg(r + 1, c) || (seg(r, c) && girder(r + 1, c));

  /* ---- HUD ---- */
  const P = () => S.pl[S.cur];
  function hud() {
    const p = P();
    put(0, 1, '       ', 15, 0); const s = String(p.score); put(7 - s.length, 1, s, 15, 0);
    put(70, 1, '       ', 15, 0); const h = String(S.hi); put(77 - h.length, 1, h, 15, 0);
    put(73, 3, 'L=' + String(p.level).padStart(2, '0'), 15, 0);
    put(74, 6, String(Math.max(0, S.bonus)).padStart(4, ' '), 15, 0);
  }
  function lifeIcons(n) { for (let i = 0; i < 4; i++) putc(2 + i, 3, i < n ? code(HX.life) : 32, 15); }
  function addScore(v) { const p = P(); p.score += v; if (p.score > S.hi) { S.hi = p.score; store.set('hi.d', S.hi); } hud(); }
  function popup(r, c, text) { S.pops.push({ r, c, text, t: 0.4 }); put(c, r, text, 15, 0); }

  /* ---- stage setup ---- */
  function drawStage() {
    const pg = PAGES[P().stage - 1];
    cls();
    for (let i = 0; i < 2000; i++) { base[i] = hexOf(pg[i]); }
    for (let r = 0; r < 24; r++) for (let c = 0; c < 80; c++) show(r, c);
    put(0, 0, '  ' + (S.cur ? '2' : '1') + ' UP', 15, 0);
    put(19, 24, BAR.trim(), 15, 0);
    S.bonus = 5000; hud();
    const st = P().stage;
    // rivets and elevator shafts come from the screen itself
    S.rivets = []; S.shafts = [];
    for (let r = 0; r < 24; r++) for (let c = 0; c < 80; c++) if (B(r, c) === HX.rivet) S.rivets.push([r, c]);
    if (st === 3) {
      for (let c = 0; c < 80; c++) if (B(12, c) === HX.pole) {
        const rows = []; for (let r = 7; r <= 22; r++) if (B(r, c) === HX.girder) rows.push(r);
        const up = S.shafts.length === 0;
        S.shafts.push({ c, up, pos: rows.map(r => r - 7), t: 0 });
      }
    }
  }
  function startLife() {
    const st = P().stage;
    drawStage();
    S.man = st === 3 ? { r: 22, c: 14 } : { r: 23, c: 20 };
    Object.assign(S.man, { mode: 'walk', t: 0, face: 1, jt: 0, jdx: 0, over: 0, fall: 0, mash: 0, swing: 0, pulse: 0 });
    S.cocos = []; S.fires = []; S.springs = []; S.pops = [];
    S.throwT = 0; S.firstDrop = st === 1; S.bonusT = 0; S.fireT = 3; S.springT = 0.2; S.freeze = 0; S.flick = 0;
    lifeIcons(P().lives);
    if (st === 3) { S.fires.push(newFire(15, 58)); S.fires.push(newFire(19, 26)); }
    drawMan();
    S.phase = 'ready'; S.timer = 1.2; S.jingle = false;
  }
  const newFire = (r, c) => ({ r, c, dir: Math.random() < 0.5 ? -1 : 1, mode: 'walk', t: 0, dr: 0 });

  /* ---- drawing the player ---- */
  function eraseMan() {
    const m = S.man;
    show(m.r, m.c);
    if (m.mash) { show(m.r - 1, m.c); for (const d of [-2, -1, 1, 2]) show(m.r, m.c + d); }
  }
  function drawMan() {
    const m = S.man;
    if (m.mash) {
      if (m.swing) { spr(m.r, m.c + m.face, HX.shaft); spr(m.r, m.c + 2 * m.face, m.face < 0 ? HX.headL : HX.headR); }
      else spr(m.r - 1, m.c, HX.mashUp);
    }
    spr(m.r, m.c, HX.man);
  }

  /* ---- player ---- */
  function held(...k) { return k.some(x => S.keys.has(x)); }
  function die() {
    S.phase = 'dying'; S.timer = 0; S.halo = false; spkStop(); clip('gg_die');
  }
  function landCheck() {
    const m = S.man;
    if (girder(m.r, m.c)) { if (m.fall >= 2) return die(); m.mode = 'walk'; m.fall = 0; return; }
    m.mode = 'fall'; m.t = 0;
  }
  function touchItems() {
    const m = S.man, h = B(m.r, m.c);
    if (ITEMS.includes(h)) { setBase(m.r, m.c, HX.girder); addScore(500); popup(m.r - 2, m.c - 1, '500'); tone(479, 0.3); }
  }
  function pullRivets(c0, c1) {
    const m = S.man;
    for (let i = S.rivets.length - 1; i >= 0; i--) {
      const [r, c] = S.rivets[i];
      if (r === m.r && c >= Math.min(c0, c1) && c <= Math.max(c0, c1) && c !== m.c) {
        setBase(r, c, HX.blank); S.rivets.splice(i, 1); addScore(100); popup(r - 2, c - 1, '100'); tone(479, 0.15);
      }
    }
    if (P().stage === 2 && !S.rivets.length) clearStage();
  }
  function stepMan(dt) {

    S.spawnT = 3.5; S.floorT = 4 + Math.random() * 2; S.blinkT = 0;
    drawShip(true); S.phase = 'play';
  }
  function spawn() {
    const roll = Math.random(), lvl = Math.min(3, Math.floor(S.p[S.cur].score / 3000));
    const type = roll < 0.32 ? 'command' : roll < 0.62 + lvl * 0.03 ? 'attack' : roll < 0.8 ? 'mine' : 'troop';
    const o = { type, r: TOP + 1 + Math.floor(Math.random() * (BOT - TOP - 2)), x: 74, t: 0, vt: 0, fire: 0.6 + Math.random() };
    if (type === 'mine') o.openAt = 30 + Math.floor(Math.random() * 25);
    S.foes.push(o); drawEnemy(o, true);
  }
  function die() {
    S.phase = 'dead'; S.timer = 0; spkStop(); clip('sf_boom'); S.sweep = false;
    for (let r = TOP - 1; r <= BOT + 1; r++) put(0, r, ' '.repeat(80), 7, 0);
    put(18, 24, ' '.repeat(45), 7, 0);
  }
  const hits = (o, r, x) => o.open ? (x === o.x && Math.abs(r - o.r) <= 1) : (r === o.r && x >= o.x && x <= o.x + 4);
  return {
    view: [0, 80], pad: 'starfighter',
    start(n) {
      S = { n, cur: 0, p: Array.from({ length: n }, () => ({ score: 0, ships: 3 })), hi: store.get(hiKey, 0) };
      cls(); loadPage('sf_board');
      for (let r = 1; r <= 24; r++) if (r !== 1) put(0, r, ' '.repeat(80), 7, 0);
      put(0, 1, C(186) + ' '.repeat(23), 7, 0);
      S.phase = 'intro'; S.timer = 2.13; clip('sf_start');
    },
    stop() { spkStop(); },
    key(k, down) {
      if (S.phase !== 'play') return;
      const s = S.ship;
      // 2.3: the ship moves while UP or DOWN is held and stops on release (2 still stops it)
      if (!down) { if ((s.v < 0 && ['Up', '4', '7', 'Home'].includes(k)) || (s.v > 0 && ['Down', '6', '9', 'PageUp'].includes(k))) s.v = 0; return; }
      if (k === 'Up' || k === '4' || k === '7' || k === 'Home') s.v = -1;
      else if (k === 'Down' || k === '6' || k === '9' || k === 'PageUp') s.v = 1;
      else if (k === 'Stop' || k === '2' || k === 'Right' || k === 'Left') s.v = 0;
      else if ((k === 'Space' || k === 'Fire') && S.ammo > 0) {
        S.ammo--; ammoBar(); S.shots.push({ r: s.r, x: SHIP_X + 5, t: 0 }); clip('sf_shot');
      }
    },
    update(dt, now) {
      if (S.phase === 'intro') { S.timer -= dt; if (S.timer <= 0) startShip(); return; }
      if (S.phase === 'dead') {
        S.timer += dt;
        label(Math.floor(S.timer / 0.267) % 2 === 1);
        if (!S.sweep && S.timer >= 3.94) { S.sweep = true; clip('sf_start'); }
        if (S.timer >= 6.09) {
          const p = S.p[S.cur]; p.ships--;
          if (S.p.every(q => q.ships <= 0)) { S.phase = 'over'; label(true); gameOver(); return; }
          label(true);
          if (S.n > 1) { const o = (S.cur + 1) % S.n; if (S.p[o].ships > 0) S.cur = o; }
          startShip();
        }
        return;
      }
      if (S.phase !== 'play') return;
      const s = S.ship;
      // ship glides until stopped
      s.t += dt;
      while (s.t >= MOVE) {
        s.t -= MOVE;
        const nr = s.r + s.v;
        if (s.v && nr >= TOP && nr <= BOT) { drawShip(false); s.r = nr; drawShip(true); } else s.v = 0;
      }
      // shots
      for (const o of S.shots) {
        o.t += dt;
        while (!o.dead && o.t >= SHOT) {
          o.t -= SHOT;
          if (getc(o.x, o.r) === 9) putc(o.x, o.r, 32, 7);
          o.x++;
          if (o.x > 79) { o.dead = true; break; }
          const f = S.foes.find(e => !e.dead && hits(e, o.r, o.x));
          if (f) {
            o.dead = true;
            if (!f.open) { drawEnemy(f, false); f.dead = true; addScore(TYPES[f.type].pts); }
            break;
          }
          putc(o.x, o.r, 9, 15);
        }
      }
      S.shots = S.shots.filter(o => !o.dead);
      // enemies
      S.spawnT -= dt;
      if (S.spawnT <= 0) { spawn(); S.spawnT = 1.0 + Math.random() * 2.0; }
      for (const o of S.foes) {
        o.t += dt;
        while (!o.dead && o.t >= ENEMY) {
          o.t -= ENEMY;
          drawEnemy(o, false);
          o.x -= 2;
          // steering: attack ships line up early, command ships late, carriers jink
          let dr = 0;
          if (o.type === 'attack' && o.x < 70) dr = Math.sign(s.r - o.r);
          else if (o.type === 'command' && o.x < 48) dr = Math.sign(s.r - o.r);
          else if (o.type === 'troop' && Math.random() < 0.25) dr = Math.random() < 0.5 ? -1 : 1;
          o.r = Math.max(TOP, Math.min(BOT - 1, o.r + dr));
          if (o.type === 'mine' && !o.open && o.x <= o.openAt) { o.open = true; o.x += 2; o.r = Math.max(TOP + 1, Math.min(BOT - 2, o.r)); }
          if (o.x < -5) { o.dead = true; break; }
          // a shot it flew into
          const q = S.shots.find(q => !q.dead && (o.open ? q.x === o.x && Math.abs(q.r - o.r) <= 1 : q.r === o.r && q.x >= o.x && q.x <= o.x + 6));
          if (q) { q.dead = true; putc(q.x, q.r, 32, 7); if (!o.open) { o.dead = true; addScore(TYPES[o.type].pts); break; } }
          drawEnemy(o, true);
        }
        if (!o.dead && o.type === 'attack') {
          o.fire -= dt;
          if (o.fire <= 0 && o.x > 30 && o.r === s.r) { o.fire = 1.2 + Math.random(); S.missiles.push({ r: o.r, x: o.x - 2, t: 0 }); }
        }
      }
      S.foes = S.foes.filter(o => !o.dead);
      for (const o of S.missiles) {
        o.t += dt;
        while (!o.dead && o.t >= MISSILE) {
          o.t -= MISSILE;
          put(o.x, o.r, '  ', 7, 0); o.x--;
          if (o.x < 0) { o.dead = true; break; }
          put(o.x, o.r, C(196) + C(196), 4, 0);
        }
      }
      S.missiles = S.missiles.filter(o => !o.dead);
      // bottom row: the ammo shuttle and the ▓▓
      S.floorT -= dt;
      if (S.floorT <= 0) {
        const shuttle = Math.random() < 0.4;
        S.floor.push({ x: 73, t: 0, shuttle, code: shuttle ? 24 : 178, attr: shuttle ? 7 << 4 : 9 });
        S.floorT = 2 + Math.random() * 3;
      }
      for (const o of S.floor) {
        o.t += dt;
        while (!o.dead && o.t >= FLOOR) {
          o.t -= FLOOR; drawFloor(o, false); o.x--;
          if (o.x < -2) { o.dead = true; break; }
          drawFloor(o, true);
        }
      }
      S.floor = S.floor.filter(o => !o.dead);
      drawShip(true);
      // collisions with your ship
      const at = x => x >= SHIP_X && x <= SHIP_X + 3;
      for (const o of S.floor) if (s.r === BOT && (at(o.x) || at(o.x + 1))) {
        if (!o.shuttle) return die();
        if (S.ammo < 25) { S.ammo = 25; ammoBar(); tone(612, 0.08); tone(816, 0.08, 0.09); }
      }
      for (const o of S.foes) for (let x = SHIP_X; x <= SHIP_X + 3; x++) if (hits(o, s.r, x)) return die();
      for (const o of S.missiles) if (o.r === s.r && (at(o.x) || at(o.x + 1))) return die();
    }
  };
})();

/* ===== F: SHOOTER =====
   Measured from the original: base ╔╦╩╦╗ on row 23 moves 30 columns a second; missiles ↑ climb 30 rows a
   second, two in the air at most. Bombers «═╬══╛ / ╘══╬═» fly at 15 or 8 columns a second; bombs ■ fall one
   row and one column (in the bomber's direction) every 0.0625 s. A bomber is worth 28 points, 36 after 500
   points. Bombers die silently; the fire, bomb, base explosion and new-base tune are recorded clips. */
GAMES.f = (() => {
  const BASE = C(201) + C(203) + C(202) + C(203) + C(187);
  const BL = C(174) + C(205) + C(206) + C(205) + C(205) + C(190);     // flying left
  const BR = C(212) + C(205) + C(205) + C(206) + C(205) + C(175);     // flying right
  const MISSILE = 24, BOMB = 254, SPARK = 248;
  const BASE_RATE = 1 / 30, MISSILE_RATE = 1 / 30, BOMB_RATE = 0.0625;
  const hiKey = 'hi.f';
  let S;
  const level = () => Math.floor(S.p[S.cur].score / 500);
  const value = () => 28 + 8 * level();
  function header(now) {
    const off = Math.floor(now / 0.267) % 2 === 1 && S.phase !== 'over';
    put(0, 0, ' '.repeat(80), 0, 7);
    if (!(off && S.cur === 0)) put(0, 0, 'PLAYER 1 SCORE :', 0, 7);
    put(31, 0, 'HIGH SCORE :', 0, 7);
    if (!(off && S.cur === 1)) put(57, 0, 'PLAYER 2 SCORE :', 0, 7);
    const sc = (v, end) => { if (v > 0) put(end - String(v).length + 1, 0, String(v), 0, 7); };
    sc(S.p[0].score, 20); sc(S.hi, 48); if (S.n > 1) sc(S.p[1].score, 77);
  }
  function status() {
    put(0, 24, ' '.repeat(80), 0, 7);
    for (let i = 0; i < S.p[S.cur].lives - 1; i++) putc(1 + i, 24, 2, 0x70);
    put(17, 24, BAR, 0, 7);
  }
  const drawBase = on => put(S.bx, 23, on ? BASE : '     ', 2, 0);
  function clearField() { for (let r = 1; r <= 23; r++) put(0, r, ' '.repeat(80), 7, 0); }
  function newLife() {
    clearField(); S.bombers = []; S.bombs = []; S.missiles = []; S.sparks = [];
    clip('sh_tune'); S.phase = 'tune'; S.timer = 2.55;
  }
  function spawnBomber() {
    const dir = Math.random() < 0.5 ? -1 : 1;
    const lv = level();
    const fast = Math.random() < 0.55 + 0.05 * lv;
    const rate = (fast ? 0.067 : 0.125) / (1 + 0.1 * lv);
    const row = 2 + Math.floor(Math.random() * 14);
    if (S.bombers.some(b => b.row === row)) return;
    S.bombers.push({ row, x: dir < 0 ? 80 : -6, dir, rate, t: 0, dropT: 0.6 + Math.random() * 1.8, dead: 0, parts: null });
  }
  function drawBomber(b, on) {
    const s = b.dir < 0 ? BL : BR;
    for (let k = 0; k < 6; k++) { const x = b.x + k; if (x >= 0 && x < 80) putc(x, b.row, on ? s.charCodeAt(k) : 32, on ? 2 : 7); }
  }
  function spark(x, y, fg, life) { if (x >= 0 && x < 80 && y >= 1 && y <= 23) { S.sparks.push({ x, y, life, fg }); putc(x, y, SPARK, fg); } }
  function hitBomber(b) {
    b.dead = 0.7; b.parts = [0, 1, 2, 3, 4, 5].filter(k => b.x + k >= 0 && b.x + k < 80);
    const p = S.p[S.cur]; p.score += value(); if (p.score > S.hi) { S.hi = p.score; store.set(hiKey, S.hi); }
  }
  function baseHit() {
    S.phase = 'boom'; S.timer = 0; clip('sh_boom');
    S.baseParts = [0, 1, 2, 3, 4];
  }
  return {
    view: [0, 80], pad: 'lrf',
    start(n) {
      S = { n, cur: 0, p: Array.from({ length: n }, () => ({ score: 0, lives: 3 })), hi: store.get(hiKey, 0),
            bx: 31, held: { L: false, R: false }, fire: false, bombers: [], bombs: [], missiles: [], sparks: [],
            phase: 'tune', timer: 2.55, mt: 0, bt: 0, spawnT: 1 };
      cls(); clearField(); status(); clip('sh_tune');
    },
    stop() { spkStop(); },
    key(k, down) {
      if (k === 'Left' || k === '4') S.held.L = down;
      if (k === 'Right' || k === '6') S.held.R = down;
      if ((k === 'Space' || k === 'Fire') && down && S.phase === 'play' && S.missiles.length < 2) {
        S.missiles.push({ x: S.bx + 2, y: 23, t: 0 }); clip('sh_fire');
      }
    },
    update(dt, now) {
      header(now);
      if (S.phase === 'tune') {
        S.timer -= dt;
        if (S.timer <= 0) { S.phase = 'play'; status(); drawBase(true); }
        return;
      }
      if (S.phase === 'boom') {
        S.timer += dt;
        // the base breaks apart into sparks while everything else holds still
        if (S.baseParts.length && Math.random() < dt * 14) {
          const k = S.baseParts.splice(Math.floor(Math.random() * S.baseParts.length), 1)[0];
          putc(S.bx + k, 23, SPARK, 6);
          spark(S.bx + k + Math.round((Math.random() - 0.5) * 12), 23 - Math.floor(Math.random() * 4), 6, 0.1);
        }
        if (S.timer >= 2.65) {
          const p = S.p[S.cur]; p.lives--;
          if (S.p.every(q => q.lives <= 0)) { clearField(); S.phase = 'over'; gameOver(); return; }
          if (S.n > 1) { const o = (S.cur + 1) % S.n; if (S.p[o].lives > 0) S.cur = o; }
          put(0, 24, ' '.repeat(80), 7, 0); S.phase = 'gap'; S.timer = 2.45; clearField();
        }
        for (const s of S.sparks) { s.life -= dt; if (s.life <= 0 && getc(s.x, s.y) === SPARK) putc(s.x, s.y, 32, 7); }
        S.sparks = S.sparks.filter(s => s.life > 0);
        return;
      }
      if (S.phase === 'gap') { S.timer -= dt; if (S.timer <= 0) { status(); clip('sh_tune'); S.phase = 'tune'; S.timer = 2.55; } return; }
      if (S.phase !== 'play') return;
      // base
      S.bt += dt;
      while (S.bt >= BASE_RATE) {
        S.bt -= BASE_RATE;
        const d = (S.held.R ? 1 : 0) - (S.held.L ? 1 : 0);
        if (d && S.bx + d >= 0 && S.bx + d <= 75) { drawBase(false); S.bx += d; drawBase(true); }
      }
      // missiles
      for (const m of S.missiles) {
        m.t += dt;
        while (m.t >= MISSILE_RATE && !m.gone) {
          m.t -= MISSILE_RATE;
          if (m.y < 23) putc(m.x, m.y, 32, 7);
          m.y--;
          if (m.y < 1) { m.gone = true; break; }
          const b = S.bombers.find(o => !o.dead && o.row === m.y && m.x >= o.x && m.x < o.x + 6);
          if (b) { hitBomber(b); m.gone = true; break; }
          const bb = S.bombs.find(o => o.y === m.y && o.x === m.x);
          if (bb) { bb.gone = true; putc(bb.x, bb.y, 32, 7); m.gone = true; break; }
          putc(m.x, m.y, MISSILE, 5);
        }
      }
      S.missiles = S.missiles.filter(m => !m.gone);
      // bombers
      S.spawnT -= dt;
      const maxB = Math.min(5, 2 + level());
      if (S.spawnT <= 0) { if (S.bombers.length < maxB) spawnBomber(); S.spawnT = 0.5 + Math.random() * 1.5; }
      for (const b of S.bombers) {
        if (b.dead) {
          b.dead -= dt;
          if (b.parts.length && Math.random() < dt * 12) {
            const k = b.parts.splice(Math.floor(Math.random() * b.parts.length), 1)[0];
            putc(b.x + k, b.row, SPARK, 12);
            spark(b.x + k + Math.round((Math.random() - 0.5) * 6), b.row + Math.round((Math.random() - 0.3) * 3), 12, 0.07);
          }
          if (b.dead <= 0) { for (let k = 0; k < 6; k++) if (b.x + k >= 0 && b.x + k < 80) putc(b.x + k, b.row, 32, 7); b.gone = true; }   // nothing of the bomber is left behind
          continue;
        }
        b.t += dt;
        while (b.t >= b.rate) {
          b.t -= b.rate; drawBomber(b, false); b.x += b.dir; drawBomber(b, true);
          if (b.x < -6 || b.x > 80) { b.gone = true; break; }
        }
        b.dropT -= dt;
        if (b.dropT <= 0 && !S.bombs.some(o => o.owner === b) && b.x > 0 && b.x < 74 && b.row < 20) {
          S.bombs.push({ x: b.x + 1 + (b.dir > 0 ? 3 : 0), y: b.row + 2, dx: b.dir, t: 0, owner: b });
          clip('sh_bomb'); b.dropT = 1 + Math.random() * 2;
        }
      }
      S.bombers = S.bombers.filter(b => !b.gone);
      // bombs
      for (const o of S.bombs) {
        if (o.gone) continue;
        o.t += dt;
        while (o.t >= BOMB_RATE && !o.gone) {
          o.t -= BOMB_RATE;
          if (getc(o.x, o.y) === BOMB) putc(o.x, o.y, 32, 7);
          o.y++; o.x += o.dx;
          if (o.x < 0 || o.x > 79) { o.gone = true; break; }
          if (o.y >= 23) {
            o.gone = true;
            if (o.x >= S.bx && o.x < S.bx + 5) { baseHit(); return; }
            for (let i = 0; i < 4; i++) spark(o.x + Math.round((Math.random() - 0.5) * 8), 23 - Math.floor(Math.random() * 4), 6, 0.08 + Math.random() * 0.25);
            break;
          }
          putc(o.x, o.y, BOMB, 7);
        }
      }
      S.bombs = S.bombs.filter(o => !o.gone);
      for (const s of S.sparks) { s.life -= dt; if (s.life <= 0 && getc(s.x, s.y) === SPARK) putc(s.x, s.y, 32, 7); }
      S.sparks = S.sparks.filter(s => s.life > 0);
      if (getc(S.bx, 23) !== 201) drawBase(true);
    }
  };
})();

/* ===== G: ASCII MAN =====
   Measured: maze, dots and pellets copied from the original screen; ASCII MAN ☻ (yellow) moves a cell every
   0.1 s and keeps going in the last direction pressed; Omega Monsters § (green, cyan, red, magenta) move a
   cell about every 0.085 s and leave the house 6.2, 13.1, 20.2 and 27 s after READY!. Dots 10 points with an
   up-down chirp. Death: everything holds 1.7 s with the original's tone, then READY! for 2 s.
   Not observed in testing (standard maze-game rules used): monsters turning blue after an aggression bit,
   their point values, and the level-clear sequence. */
GAMES.g = (() => {
  const MAN = 2, MON = 21, DOT = 249, PEL = 42, X0 = 18, X1 = 62, Y0 = 0, Y1 = 22, TUN = 11;
  const HOUSE = [[11, 37], [11, 39], [11, 41], [11, 43]], MCOL = [2, 3, 4, 5], RELEASE = [6.2, 13.1, 20.2, 27];
  const START = [17, 40], DIRS = { Up: [-1, 0], Down: [1, 0], Left: [0, -1], Right: [0, 1] };
  // 2.7.7: 20% slower than measured (0.1 / 0.085 s); with two-column sideways steps the original pace felt quick
  const MAN_STEP = 0.12, MON_STEP = 0.102;
  const isWall = c => c >= 179 && c <= 218;
  let S, maze, mazeAt;          // maze: walls + original dots, saved from the board page
  const hiKey = 'hi.g';
  function walkable(r, x) {
    if (r === TUN && (x < X0 || x > X1)) return true;
    if (r < Y0 || r > Y1 || x < X0 || x > X1) return false;
    return !isWall(maze[r * 80 + x]) && !(r === 10 && x >= 39 && x <= 41);   // the house door
  }
  // everyone moves on the dot grid: even columns, two columns per sideways step (2.6). The walls are drawn with
  // a blank column between blocks, so a one-column step let ASCII MAN slip up those gutters past the dots.
  const wrap = x => x < X0 - 2 ? X1 + 2 : x > X1 + 2 ? X0 - 2 : x;
  function cellUnder(r, x) {           // what's drawn on the maze at this cell (dot, pellet or blank)
    if (x < X0 || x > X1) return [32, 7];
    const d = S.dots[r * 80 + x];
    return d ? [d, 7] : [maze[r * 80 + x], mazeAt[r * 80 + x]];
  }
  function drawCell(r, x) { const [c, a] = cellUnder(r, x); putc(x, r, c, a); }
  function drawSprites() {
    for (const m of S.mons) if (m.x >= X0 && m.x <= X1) putc(m.x, m.r, MON, m.fright > 0 ? (m.fright < 2 && Math.floor(m.fright * 4) % 2 ? 15 : 1) : m.col);
    if (S.man.x >= X0 && S.man.x <= X1) putc(S.man.x, S.man.r, MAN, 14);
  }
  function eraseSprites() { for (const m of S.mons) drawCell(m.r, m.x); drawCell(S.man.r, S.man.x); }
  function resetActors() {
    S.man = { r: START[0], x: START[1], dir: null, want: null, t: 0 };
    S.mons = HOUSE.map(([r, x], i) => ({ r, x, home: true, col: MCOL[i], dir: 'Up', t: 0, fright: 0, release: RELEASE[i], eaten: false }));
    S.clock = 0;
  }
  function board() {
    loadPage('am_board');
    maze = scrCh.slice(); mazeAt = scrAt.slice();
    for (let r = 0; r < 23; r++) for (let x = X0; x <= X1; x++) {
      const i = r * 80 + x;
      if (maze[i] === DOT || maze[i] === PEL || maze[i] === MON || maze[i] === MAN || (r === 13 && !isWall(maze[i]))) { maze[i] = 32; mazeAt[i] = 7; }
    }
    for (let r = 0; r < 25; r++) for (let x = 0; x < 18; x++) putc(x, r, 32, 7);
    put(18, 13, ' '.repeat(45), 7, 0);
  }
  function freshDots() {
    const page = b64bytes(ASSETS.pages.am_board);
    S.dots = new Uint8Array(2000);
    for (let i = 0; i < 2000; i++) if (page[i] === DOT || page[i] === PEL) S.dots[i] = page[i];
    S.left = S.dots.filter(Boolean).length;
    for (let r = 0; r < 23; r++) for (let x = X0; x <= X1; x++) drawCell(r, x);
  }
  function side() {
    for (let i = 0; i < 3; i++) putc(6 + i * 2, 4, 32, 7);
    for (let i = 0; i < S.p[S.cur].lives - 1; i++) putc(6 + i * 2, 4, MAN, 14);
    put(0, 2, ' '.repeat(12), 7, 0);

window.addEventListener('keydown', e => {
  const k = physKey(e);
  if (!k || ['Control', 'Alt', 'Shift', 'Meta'].includes(e.key)) return;
  e.preventDefault();
  if (e.repeat && Sys.state === 'game' && Sys.game.pad !== 'hopper') return;
  sendKey(k, { Ctrl: e.ctrlKey, Alt: e.altKey, Shift: e.shiftKey });
});
window.addEventListener('keyup', e => { const k = physKey(e); if (k) keyUp(k); });

/* switch bar: pad/keys and layout on the left; sound and display on the right */
const modeBtn = document.getElementById('modeBtn'), layBtn = document.getElementById('layBtn');
function setMode(m) {
  ctlMode = m;
  document.getElementById('padPane').hidden = m !== 'pad';
  document.getElementById('kbdPane').hidden = m !== 'kbd';
  modeBtn.textContent = m === 'pad' ? 'Pad' : 'Keys';
  layBtn.hidden = m !== 'pad';
  held.forEach((_, id) => release(id));
  store.set('mode', m);
}
modeBtn.addEventListener('click', () => setMode(ctlMode === 'pad' ? 'kbd' : 'pad'));
// the layout button draws the current arrangement in miniature
function layIcon(spec, bias) {
  const r = (x, y, w, h) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="1.5"/>`;
  if (spec.kind === 'row') return spec.b.length === 1 ? r(12.5, 5, 9, 9) : r(6.5, 5, 9, 9) + r(18.5, 5, 9, 9);
  if (spec.kind === 'x') {
    const x0 = bias === 'right' ? 15 : bias === 'split' ? 8 : 1, fx = bias === 'right' ? 1 : 26;
    if (spec.eight) { let g = ''; for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) if (i !== 1 || j !== 1) g += r(x0 + j * 6, 1 + i * 6, 5, 5); return g + (spec.b.f ? r(fx, 1, 7, 17) : ''); }
    const d = `<path d="M${x0 + 6} 1h5v6l-2.5 2.5L${x0 + 6} 7zM${x0 + 6} 18h5v-6l-2.5-2.5L${x0 + 6} 12zM${x0} 6.5v5h6l2.5-2.5L${x0 + 6} 6.5zM${x0 + 17} 6.5v5h-6l-2.5-2.5L${x0 + 11} 6.5z"/>`;
    return spec.b.f ? d + r(fx, 1, 7, 17) : d;
  }
  if (spec.kind === 8) {
    let d = '';
    const x0 = bias === 'right' ? 13 : 1, fx = bias === 'right' ? 1 : 26;
    for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) if (!(i === 1 && j === 1)) d += r(x0 + j * 6.5, 1 + i * 6, 5, 5);
    return d + r(fx, 1, 7, 17);
  }
  if (bias === 'slide') return r(1, 5, 32, 9) + '<path d="M6 9.5h22M9 7l-3 2.5L9 12M25 7l3 2.5L25 12"/>';
  const cols = COLS4[bias], X = [1, 12.5, 24];
  let d = '';
  cols.forEach((c, i) => {
    if (c === 's') d += spec.f ? r(X[i], 1, 9, 17) : r(X[i], 1, 9, 8) + r(X[i], 10, 9, 8);
    else d += r(X[i], 5, 9, 9);
  });
  return d;
}
function syncLayoutBtn() {
  const spec = Pad.cur; if (!spec) return;
  layBtn.innerHTML = `<svg viewBox="0 0 34 19" aria-hidden="true">${layIcon(spec, Pad.bias)}</svg>`;
  layBtn.disabled = spec.allow.length < 2;
  layBtn.setAttribute('aria-label', 'Pad layout: ' + Pad.bias);
}
layBtn.addEventListener('click', () => {
  const spec = Pad.cur; if (!spec || spec.allow.length < 2) return;
  const next = spec.allow[(spec.allow.indexOf(Pad.bias) + 1) % spec.allow.length];
  store.set(biasKey(), next); refreshPad();
});
const sndBtn = document.getElementById('sndBtn');
function toggleSound() { soundOn = !soundOn; store.set('sound', soundOn); sndBtn.textContent = soundOn ? 'Snd: on' : 'Snd: off'; if (!soundOn) spkStop(); }
sndBtn.addEventListener('click', () => { ensureAudio(); toggleSound(); });
sndBtn.textContent = soundOn ? 'Snd: on' : 'Snd: off';
document.getElementById('phosBtn').addEventListener('click', () => setPhosphor((phosIdx + 1) % PHOSPHORS.length));
// F1 (boss) and F10 (menu) as small chips, so they work without the keyboard
for (const k of ['F1', 'F10']) document.getElementById('k' + k).addEventListener('click', () => { held.forEach((_, id) => release(id)); ensureAudio(); keyDown(k); });

document.addEventListener('visibilitychange', () => {
  if (document.hidden && Sys.state === 'game' && !Sys.prompt) { held.forEach((_, id) => release(id)); askRow24('leave'); }
});
function requestWake() { try { navigator.wakeLock && navigator.wakeLock.request('screen').catch(() => {}); } catch (e) {} }

/* ===== start ===== */
function start() {
  setPhosphor(phosIdx);
  setMode(store.get('mode', 'pad'));
  fit();
  goBoot();
  let last = performance.now();
  function frame(nowMs) {
    const dt = Math.min(0.05, (nowMs - last) / 1000);
    last = nowMs;
    const now = nowMs / 1000;
    tickHeld(dt);
    sysUpdate(dt, now);
    refreshPad();
    render();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}
start();


})();
</script>
<script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});</script>
